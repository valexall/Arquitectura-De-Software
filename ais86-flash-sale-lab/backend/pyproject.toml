[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-sale-backend"
version = "0.1.0"
description = "Flash Sale backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "SQLAlchemy[asyncio]==2.1.6",
    "psycopg[binary]==3.3.6",
    "redis==8.1.0",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "pytest==9.2.0",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
